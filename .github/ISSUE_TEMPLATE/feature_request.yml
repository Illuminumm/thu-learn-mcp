name: Feature request / 功能建议
description: 描述使用场景和期望的改进。
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决什么问题？
      description: 用虚构数据举例，不要粘贴真实课程正文或账号信息。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 可说明期望的工具参数、返回值和可接受的替代方案。首版保持学校业务只读。
    validations:
      required: true
